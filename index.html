<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>让我们开始吧</title>
    <link rel="stylesheet" href="css/style.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.bing.com https://www.bing.com https://suggestqueries.google.com https://www.baidu.com https://suggestion.baidu.com https://duckduckgo.com;">
</head>
<body>
    <!-- 背景系统 -->
    <div class="background-system" id="backgroundSystem">
        <div class="background-layer" id="backgroundLayerA"></div>
        <div class="background-layer" id="backgroundLayerB"></div>
        <div class="background-overlay" id="backgroundOverlay"></div>
    </div>
    
    <!-- 主容器 -->
    <div class="container">
        <!-- 壁纸切换按钮 -->
        <div class="wallpaper-controls">
            <div class="wallpaper-switch" id="wallpaperSwitch">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </div>
            <button class="wallpaper-settings-btn" id="wallpaperSettingsBtn" type="button" title="背景设置">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.33 1V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-.33-1 1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1-.33H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1-.33 1.65 1.65 0 0 0 .6-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .33-1V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 .33 1 1.65 1.65 0 0 0 1 .6 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.24.3.44.64.6 1 .12.33.18.68.18 1.03s-.06.7-.18 1.03c-.16.36-.36.7-.6 1z"></path>
                </svg>
            </button>
        </div>
        
        <!-- 搜索区域 -->
        <div class="search-container">
            <div class="search-box">
                <!-- 搜索引擎下拉选择 -->
                <div class="search-engine-picker" id="searchEnginePicker">
                    <button class="search-engine-btn" id="searchEngineBtn" type="button" data-engine="Bing" aria-label="搜索引擎：Bing" aria-haspopup="listbox" aria-controls="searchEngineDropdown" aria-expanded="false">
                        <span class="engine-icon" id="currentEngineIcon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                            <path fill="#00809D" d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
                            </svg>
                        </span>
                        <span class="engine-name" id="currentEngine">Bing</span>
                        <svg class="search-engine-chevron" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="search-engine-dropdown" id="searchEngineDropdown" role="listbox" aria-label="搜索引擎" hidden>
                        <button class="engine-option" type="button" role="option" aria-selected="false" tabindex="-1" data-engine="Google" data-url="https://www.google.com/search?q=">
                            <span class="engine-icon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                            </span>
                            <span class="engine-name">Google</span>
                            <svg class="engine-check" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="5 12 9 16 19 6"></polyline>
                            </svg>
                        </button>
                        <button class="engine-option" type="button" role="option" aria-selected="true" tabindex="-1" data-engine="Bing" data-url="https://cn.bing.com/search?q=">
                            <span class="engine-icon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                <path fill="#00809D" d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
                                </svg>
                            </span>
                            <span class="engine-name">Bing</span>
                            <svg class="engine-check" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="5 12 9 16 19 6"></polyline>
                            </svg>
                        </button>
                        <button class="engine-option" type="button" role="option" aria-selected="false" tabindex="-1" data-engine="百度" data-url="https://www.baidu.com/s?wd=">
                            <span class="engine-icon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                <path fill="#2932E1" d="M6.5 10.5c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5zm11 0c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5z"/>
                                <path fill="#2932E1" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                                </svg>
                            </span>
                            <span class="engine-name">百度</span>
                            <svg class="engine-check" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="5 12 9 16 19 6"></polyline>
                            </svg>
                        </button>
                        <button class="engine-option" type="button" role="option" aria-selected="false" tabindex="-1" data-engine="DuckDuckGo" data-url="https://duckduckgo.com/?q=">
                            <span class="engine-icon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                <path fill="#DE5833" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                                <circle cx="12" cy="12" r="5" fill="#DE5833"/>
                                </svg>
                            </span>
                            <span class="engine-name">DuckDuckGo</span>
                            <svg class="engine-check" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="5 12 9 16 19 6"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- 搜索图标 -->
                <div class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
                
                <!-- 搜索输入框 -->
                <div class="search-input-wrapper">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索互联网...">
                    <!-- 搜索历史记录开关 -->
                    <div class="search-history-toggle" id="searchHistoryToggle" title="搜索历史记录">
                        <input type="checkbox" id="searchHistorySwitch" class="search-history-switch">
                        <label for="searchHistorySwitch" class="toggle-label">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <!-- 搜索历史记录下拉框 -->
                    <div class="search-history-dropdown" id="searchHistoryDropdown">
                        <div class="search-history-header">
                            <h4>搜索历史</h4>
                            <button class="clear-history-btn" id="clearHistoryBtn">清除全部</button>
                        </div>
                        <div class="search-history-list" id="searchHistoryList">
                            <!-- 搜索历史记录将通过JavaScript动态添加 -->
                        </div>
                    </div>
                    <!-- 联想搜索下拉框 -->
                    <div class="search-suggestions-dropdown" id="searchSuggestionsDropdown">
                        <div class="search-suggestions-header">
                            <h4>联想搜索</h4>
                        </div>
                        <div class="search-suggestions-list" id="searchSuggestionsList">
                            <!-- 联想词将通过JavaScript动态添加 -->
                        </div>
                    </div>
                </div>
                
                <!-- 搜索按钮 -->
                <button class="search-button" id="searchButton">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- 网站快捷方式 -->
        <div class="shortcuts-container">
            <div class="shortcuts-header">
                <div class="shortcut-heading">
                    <h3>快捷方式</h3>
                    <span class="shortcut-sort-feedback" id="shortcutSortFeedback" aria-hidden="true" hidden></span>
                </div>
                <div class="header-actions">
                    <div class="shortcut-sort-help-anchor">
                        <button class="shortcut-action-btn" id="dragHintBtn" type="button" aria-label="排序操作说明" aria-describedby="shortcutSortHelp" aria-controls="shortcutSortHelp" aria-expanded="false">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="8 6 2 12 8 18"></polyline>
                                <polyline points="16 6 22 12 16 18"></polyline>
                            </svg>
                        </button>
                        <div class="shortcut-sort-help" id="shortcutSortHelp" role="tooltip" hidden>
                            <p class="shortcut-sort-help-title" id="shortcutSortHelpTitle">调整快捷方式</p>
                            <p id="shortcutSortHelpPointer">按住鼠标左键拖动卡片，松手放置；移到区域外松手可取消。</p>
                        </div>
                    </div>
                    <button class="shortcut-action-btn" id="copyShortcutMetaBtn" type="button" aria-label="复制快捷方式元数据" title="复制快捷方式元数据">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                    <button class="shortcut-action-btn" id="importShortcutMetaBtn" type="button" aria-label="导入快捷方式元数据" title="导入快捷方式元数据">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                    <button class="shortcut-action-btn" id="shortcutSearchBtn" type="button" aria-label="搜索快捷方式" title="搜索快捷方式">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                    <div class="shortcut-search-wrapper" id="shortcutSearchWrapper">
                        <input type="text" class="shortcut-search-input" id="shortcutSearchInput" placeholder="搜索快捷方式...">
                        <button class="shortcut-search-clear" id="clearShortcutSearchBtn" type="button" aria-label="清除搜索" title="清除搜索" hidden>×</button>
                    </div>
                    <button class="add-shortcut-btn" id="addShortcutBtn">+</button>
                </div>
            </div>
            <div class="shortcuts" id="shortcuts" role="list" aria-label="网站快捷方式">
                <!-- 快捷方式将通过JavaScript动态添加 -->
            </div>
            <p class="visually-hidden" id="shortcutSortDescription">按住鼠标左键拖动卡片，松手放置；移到区域外松手可取消。</p>
            <div class="visually-hidden" id="shortcutSortStatus" role="status" aria-live="polite" aria-atomic="true"></div>
        </div>
        
        <!-- 添加快捷方式模态框 -->
        <div class="modal" id="addShortcutModal">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">添加快捷方式</h2>
                    <button class="close-btn" id="closeModal" type="button" aria-label="关闭弹窗">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="shortcutForm">
                        <div class="form-group">
                            <label for="shortcutName">名称</label>
                            <input type="text" id="shortcutName" placeholder="输入网站名称" required>
                        </div>
                        <div class="form-group">
                            <label for="shortcutUrl">网址</label>
                            <input type="url" id="shortcutUrl" placeholder="https://example.com" required>
                        </div>
                        <button type="submit" class="submit-btn" id="submitBtn">添加快捷方式</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 撤销浮层独立于玻璃容器，不占用网格布局空间。 -->
    <div class="shortcut-sort-undo" id="shortcutSortUndo" hidden>
        <span>顺序已调整</span>
        <button class="shortcut-sort-action" id="undoShortcutSortBtn" type="button">撤销</button>
    </div>

    <!-- 背景设置面板 -->
    <aside class="bg-settings-panel" id="bgSettingsPanel" aria-hidden="true">
        <div class="bg-settings-header">
            <h3>背景设置</h3>
            <button class="bg-settings-close" id="bgSettingsClose" type="button" aria-label="关闭背景设置">×</button>
        </div>
        <div class="bg-settings-body">
            <div class="bg-settings-item">
                <label for="bgModeSelect">背景模式</label>
                <select id="bgModeSelect">
                    <option value="mixed">混合（本地+在线）</option>
                    <option value="local">仅本地</option>
                    <option value="online">仅在线</option>
                    <option value="gradient">渐变</option>
                    <option value="solid">纯色</option>
                </select>
            </div>
            <div class="bg-settings-item">
                <label for="bgAutoRotate">自动轮播</label>
                <div class="bg-auto-rotate-toggle">
                    <input type="checkbox" id="bgAutoRotate" class="search-history-switch">
                    <label for="bgAutoRotate" class="toggle-label">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
            <div class="bg-settings-item">
                <label for="bgRotateInterval">轮播间隔（秒）<span id="bgRotateIntervalValue"></span></label>
                <input type="range" id="bgRotateInterval" min="10" max="1800" step="10">
            </div>
            <div class="bg-settings-item">
                <label for="bgOverlayOpacity">遮罩强度（%）<span id="bgOverlayOpacityValue"></span></label>
                <input type="range" id="bgOverlayOpacity" min="0" max="70" step="1">
            </div>
            <div class="bg-settings-item">
                <label for="bgUiGlassBlur">界面毛玻璃强度（px）<span id="bgUiGlassBlurValue"></span></label>
                <input type="range" id="bgUiGlassBlur" min="0" max="30" step="1">
            </div>
            <div class="bg-settings-item">
                <label for="bgBlur">模糊（px）<span id="bgBlurValue"></span></label>
                <input type="range" id="bgBlur" min="0" max="20" step="1">
            </div>
            <div class="bg-settings-item">
                <label for="bgBrightness">亮度（%）<span id="bgBrightnessValue"></span></label>
                <input type="range" id="bgBrightness" min="60" max="140" step="1">
            </div>
            <div class="bg-settings-item">
                <label for="bgSaturate">饱和度（%）<span id="bgSaturateValue"></span></label>
                <input type="range" id="bgSaturate" min="50" max="180" step="1">
            </div>
            <div class="bg-settings-item">
                <label for="bgContrast">对比度（%）<span id="bgContrastValue"></span></label>
                <input type="range" id="bgContrast" min="50" max="150" step="1">
            </div>
            <div class="bg-settings-item" id="bgSolidColorRow">
                <label for="bgSolidColor">纯色值</label>
                <input type="color" id="bgSolidColor">
            </div>
            <div class="bg-settings-item">
                <label for="bgUploadInput">上传本地背景（仅本地保存）</label>
                <input type="file" id="bgUploadInput" accept="image/*">
                <small id="bgUploadHint">单图上限 8MB，总上限 80MB，最多 30 张。</small>
            </div>
            <div class="bg-settings-item">
                <label>已上传背景</label>
                <div class="bg-uploaded-list" id="bgUploadedList"></div>
            </div>
            <div class="bg-settings-actions">
                <button type="button" id="bgResetBtn" class="bg-reset-btn">恢复默认设置</button>
                <button type="button" id="bgApplyBtn">应用设置</button>
            </div>
            <div class="author-credit author-credit--panel">
                <a href="https://hevilking.com" target="_blank" rel="noopener noreferrer">
                    Made by hevilking
                </a>
            </div>
        </div>
    </aside>

    
    <script type="module" src="js/main.js?v=2.0"></script>
</body>
</html>
