<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>让我们开始吧</title>
    <link rel="stylesheet" href="css/style.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
</head>
<body>
    <!-- 背景图片 -->
    <div class="background" id="background"></div>
    
    <!-- 主容器 -->
    <div class="container">
        <!-- 壁纸切换按钮 -->
        <div class="wallpaper-controls">
            <div class="wallpaper-switch" id="wallpaperSwitch">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </div>
        </div>
        
        <!-- 搜索区域 -->
        <div class="search-container">
            <div class="search-box">
                <!-- 搜索引擎选择按钮 -->
                <button class="search-engine-btn" id="searchEngineBtn" data-engine="Bing">
                    <span id="currentEngine">Bing</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                
                <!-- 搜索图标 -->
                <div class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
                
                <!-- 搜索输入框 -->
                <div class="search-input-wrapper">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索互联网...">
                    <!-- 搜索历史记录开关 -->
                    <div class="search-history-toggle" id="searchHistoryToggle" title="搜索历史记录">
                        <input type="checkbox" id="searchHistorySwitch" class="search-history-switch">
                        <label for="searchHistorySwitch" class="toggle-label">
                            <span class="toggle-slider"></span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                            </svg>
                        </label>
                    </div>
                    <!-- 搜索历史记录下拉框 -->
                    <div class="search-history-dropdown" id="searchHistoryDropdown">
                        <div class="search-history-header">
                            <h4>搜索历史</h4>
                            <button class="clear-history-btn" id="clearHistoryBtn">清除全部</button>
                        </div>
                        <div class="search-history-list" id="searchHistoryList">
                            <!-- 搜索历史记录将通过JavaScript动态添加 -->
                        </div>
                    </div>
                </div>
                
                <!-- 搜索按钮 -->
                <button class="search-button" id="searchButton">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- 网站快捷方式 -->
        <div class="shortcuts-container">
            <div class="shortcuts-header">
                <h3>快捷方式</h3>
                <div class="header-actions">
                    <div class="drag-hint" title="拖拽快捷方式可以重新排序">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="8 6 2 12 8 18"></polyline>
                            <polyline points="16 6 22 12 16 18"></polyline>
                        </svg>
                    </div>
                    <button class="add-shortcut-btn" id="addShortcutBtn">+</button>
                </div>
            </div>
            <div class="shortcuts" id="shortcuts">
                <!-- 快捷方式将通过JavaScript动态添加 -->
            </div>
        </div>
        
        <!-- 添加快捷方式模态框 -->
        <div class="modal" id="addShortcutModal">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">添加快捷方式</h2>
                    <span class="close" id="closeModal">&times;</span>
                </div>
                <div class="modal-body">
                    <form id="shortcutForm">
                        <div class="form-group">
                            <label for="shortcutName">名称</label>
                            <input type="text" id="shortcutName" placeholder="输入网站名称" required>
                        </div>
                        <div class="form-group">
                            <label for="shortcutUrl">网址</label>
                            <input type="url" id="shortcutUrl" placeholder="https://example.com" required>
                        </div>
                        <button type="submit" class="submit-btn" id="submitBtn">添加快捷方式</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 搜索引擎选择弹窗 -->
    <div class="search-engine-modal" id="searchEngineModal">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>选择搜索引擎</h3>
                <button class="close-btn" id="closeSearchModal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="search-engines">
                <div class="engine-option" data-engine="Google" data-url="https://www.google.com/search?q=">
                    <div class="engine-icon google-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                    </div>
                    <div class="engine-info">
                        <h4>Google</h4>
                        <p>全球最大的搜索引擎</p>
                    </div>
                </div>
                
                <div class="engine-option" data-engine="百度" data-url="https://www.baidu.com/s?wd=">
                    <div class="engine-icon baidu-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                            <path fill="#2932E1" d="M6.5 10.5c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5zm11 0c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5z"/>
                            <path fill="#2932E1" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                        </svg>
                    </div>
                    <div class="engine-info">
                        <h4>百度</h4>
                        <p>中文搜索引擎首选</p>
                    </div>
                </div>
                
                <div class="engine-option" data-engine="Bing" data-url="https://cn.bing.com/search?q=">
                    <div class="engine-icon bing-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                            <path fill="#00809D" d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
                        </svg>
                    </div>
                    <div class="engine-info">
                        <h4>Bing</h4>
                        <p>微软出品搜索引擎</p>
                    </div>
                </div>
                
                <div class="engine-option" data-engine="DuckDuckGo" data-url="https://duckduckgo.com/?q=">
                    <div class="engine-icon duckduckgo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                            <path fill="#DE5833" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                            <circle cx="12" cy="12" r="5" fill="#DE5833"/>
                        </svg>
                    </div>
                    <div class="engine-info">
                        <h4>DuckDuckGo</h4>
                        <p>注重隐私的搜索引擎</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 作者标识 -->
    <div class="author-credit">
        <a href="https://hevilking.com" target="_blank" rel="noopener noreferrer">
            Made by hevilking
        </a>
    </div>
    
    <script src="js/main.js?v=1.5"></script>
</body>
</html>
